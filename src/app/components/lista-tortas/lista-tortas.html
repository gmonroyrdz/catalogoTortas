<div class="contenedor">
    <h1>Menú de Tortas</h1>
    <input  type="text" class="buscador"
     placeholder="Busca por nombre o ingrediente ..."
     [(ngModel)]="filtro" />
     <p class="contador">
        Mostrando {{tortasFiltradas().length}}
        de  {{tortas().length}} tortas
     </p>
     <div class="lista">
        @for (torta of tortasFiltradas(); track torta.id) {
            <div class="torta-card">
                <div class="torta-info">
                    <h3>{{torta.nombre}}</h3>
                    <p class="ingredientes">
                        <strong>Ingredientes:</strong>{{torta.ingredientes.join(', ')}}
                    </p>
                </div>
                <div class="precio">
                    ${{ torta.precio}}
                </div>
            </div>
        } @empty {
            <div class="sin-resultados">
                No se encontraron tortas con "{{filtro()}}"
            </div>
        }
     </div>
</div>
